[package]
name = "orbix-cli"
version = "0.1.1"
edition = "2021"
description = "orbix - Orbix Core's local-first agent from the terminal (bob is an alias)"

[lib]
name = "orbix_cli"
path = "src/lib.rs"

[[bin]]
name = "orbix"
path = "src/bin/orbix.rs"

[[bin]]
name = "bob"
path = "src/bin/bob.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
atty = "0.2"
anstream = "1.0"
anstyle = "1"
dirs = "7"
# LAN peer discovery: browse for Orbix hosts advertising `_orbix._tcp` so
# `orbix connect` lists them instead of the user typing an IP. Same crate the
# app uses to advertise; pure Rust, cross-platform.
mdns-sd = "0.21"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

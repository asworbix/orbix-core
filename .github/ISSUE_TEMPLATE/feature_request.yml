name: Feature request
description: Something Orbix Core should do that it does not do today.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to get done, and where does Orbix Core stop short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you imagine it working. If Bob should be able to do it by voice, say what you would say.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
